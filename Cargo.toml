[workspace]
resolver = "2"
members = ["crates/core", "crates/shim", "src-tauri"]

[workspace.dependencies]
envrouter-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
