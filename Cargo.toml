[workspace]
resolver = "2"
members = ["crates/build-support", "crates/cli", "crates/core", "crates/keychain", "crates/ops", "crates/shim", "src-tauri"]

# EnvRouter's one version: every crate inherits it (`version.workspace = true`), and the app takes
# it from src-tauri's Cargo.toml, since tauri.conf.json names none. package.json repeats it; the
# release checks the tag against both.
[workspace.package]
version = "0.7.1"

[workspace.dependencies]
envrouter-build-support = { path = "crates/build-support" }
envrouter-core = { path = "crates/core" }
envrouter-keychain = { path = "crates/keychain" }
envrouter-ops = { path = "crates/ops" }
nix = { version = "0.31", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
security-framework = "3"
tempfile = "3"
thiserror = "2"

# Every member opts in with `[lints] workspace = true`. CI runs clippy with `-D warnings`, so
# these are errors there. A curated slice of clippy::pedantic: the lints that catch real
# mistakes or keep the code uniform, not the ones that only add ceremony to an app.
[workspace.lints.rust]
# Denied, not forbidden, so the one FFI module (the Windows Credential Manager) can allow it
# with a reason. Everything else is an error, as before.
unsafe_code = "deny"

[workspace.lints.clippy]
cloned_instead_of_copied = "warn"
explicit_iter_loop = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
items_after_statements = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
match_wildcard_for_single_variants = "warn"
needless_pass_by_value = "warn"
range_plus_one = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
dbg_macro = "warn"
todo = "warn"

# The app and the CLI: parallel codegen, no cross-crate LTO (`false` still optimises within each
# crate), optimised for size, since their speed is the webview's and the disk's, not Rust's.
# Measured on a cold build of both on an M-series Mac: whole-program LTO with one codegen unit
# took 127s for a 10.4MB binary (5.0MB compressed); this takes 60s for 11.5MB (4.4MB compressed).
[profile.release]
lto = false
opt-level = "s"
panic = "abort"
strip = true

# The shim and the secrets helper, which run on every agent launch, keep whole-program LTO, one
# codegen unit and full speed (https://tauri.app/concept/size/#cargo-configuration). They're
# small, so it costs seconds. crates/build-support builds them with it whatever the outer profile.
[profile.helpers]
inherits = "release"
codegen-units = 1
lto = true
opt-level = 3
