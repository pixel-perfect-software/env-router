# Linux and Windows checks for EnvRouter, runnable on a Mac with Podman or Docker:
#
#   podman compose -f dev/containers/compose.yaml run --rm linux-test
#   podman compose -f dev/containers/compose.yaml run --rm linux-app
#   podman compose -f dev/containers/compose.yaml run --rm linux-bundle
#   podman compose -f dev/containers/compose.yaml run --rm windows-helper-build
#   podman compose -f dev/containers/compose.yaml run --rm windows-helper-wine
#
# (`docker compose` works the same.) The source is mounted read-only and copied in, so nothing
# is written to the checkout; builds and downloads persist in named volumes.

# Everything here (containers, images, volumes) is grouped under this project name.
name: envrouter-dev

x-common: &common
  # Podman's machine runs SELinux and gives each container its own label categories. The AppImage
  # tooling copies /usr/share/glib-2.0/schemas from the container with that label, so the next
  # container couldn't open the AppDir the last one left in the target volume, and bundling failed
  # with "Permission denied (os error 13)" (#101). These are local build containers, so they share.
  security_opt:
    - label=disable
  volumes:
    - ../..:/src:ro
    - ./scripts:/scripts:ro
    - target:/target
    - registry:/usr/local/cargo/registry
    - rustup:/usr/local/rustup
  working_dir: /work

services:
  # Backend, shim, secrets and CLI: clippy and tests with every shell required, then the
  # secrets round trip through a GNOME Keyring in a private D-Bus session.
  linux-test:
    <<: *common
    image: envrouter-dev/linux:latest
    build: { context: ., dockerfile: Containerfile }
    labels: { envrouter.purpose: "Linux backend, shim, secrets and CLI tests" }
    command: /scripts/linux-test.sh

  # The desktop app crate: clippy with WebKitGTK.
  linux-app:
    <<: *common
    image: envrouter-dev/linux:latest
    labels: { envrouter.purpose: "Linux desktop app build" }
    command: /scripts/linux-app.sh

  # The Linux release build, as release.yml runs it: the .deb (with the Windows helper inside)
  # and the AppImage, left in the bundles volume.
  linux-bundle:
    <<: *common
    image: envrouter-dev/linux:latest
    labels: { envrouter.purpose: "Linux release bundles (.deb, AppImage)" }
    volumes:
      - ../..:/src:ro
      - ./scripts:/scripts:ro
      - target:/target
      - registry:/usr/local/cargo/registry
      - rustup:/usr/local/rustup
      - bundles:/out
    command: /scripts/linux-bundle.sh

  # The Windows secrets helper (Credential Manager), cross-compiled with mingw and linted, natively.
  # It lands in the windows-exe volume for windows-helper-wine.
  windows-helper-build:
    <<: *common
    image: envrouter-dev/linux:latest
    labels: { envrouter.purpose: "Windows secrets helper cross-build" }
    volumes:
      - ../..:/src:ro
      - ./scripts:/scripts:ro
      - target:/target
      - registry:/usr/local/cargo/registry
      - rustup:/usr/local/rustup
      - windows-exe:/out
    command: /scripts/windows-helper-build.sh

  # Runs that helper under Wine: its own round trip, through the store-get/set/delete bridge a
  # WSL distro uses. x86_64, since Wine runs x86_64 Windows binaries; emulated on Apple
  # Silicon, which is why only Wine runs here and the build happens natively. Run
  # windows-helper-build first.
  windows-helper-wine:
    platform: linux/amd64
    image: envrouter-dev/wine:latest
    build: { context: ., dockerfile: Containerfile.wine }
    labels: { envrouter.purpose: "Windows secrets helper under Wine" }
    volumes:
      - ./scripts:/scripts:ro
      - windows-exe:/out:ro
    command: /scripts/windows-helper-wine.sh

volumes:
  target:
  registry:
  rustup:
  windows-exe:
  bundles:
