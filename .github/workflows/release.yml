name: Release

# Pushing a tag like `v0.2.0` builds EnvRouter for macOS and Linux, publishes one GitHub release
# with every build, and renders the Homebrew cask (the macOS app) and formula (the CLI, macOS and
# Linux) into pixel-perfect-software/homebrew-tap from packaging/homebrew. The tag must match the
# version in src-tauri/tauri.conf.json and sit on main.

on:
  push:
    tags: ['v*']

# Actions are pinned to the commit of a release, as in ci.yml. Nothing here restores a cache:
# a release builds only from its tagged source, so a poisoned cache can't reach what users
# install.
permissions:
  contents: write # to create the release

# One release at a time, so two can't race to update the tap.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # to check the tag is on main
          persist-credentials: false
      - id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          app=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$version" != "$app" ]; then
            echo "::error::$GITHUB_REF_NAME doesn't match the app's version ($app in src-tauri/tauri.conf.json)."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME isn't on main."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  macos:
    needs: check
    # Apple Silicon: the bundle is arm64-only for now.
    runs-on: macos-15
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # The runner's rustup installs the version rust-toolchain.toml pins.
      - run: rustup show active-toolchain || rustup toolchain install
      - run: pnpm install --frozen-lockfile
      # Signs ad hoc (bundle.macOS.signingIdentity "-"); there's no Developer ID to notarize with.
      - run: pnpm tauri build
      - name: Package
        run: |
          mkdir -p out
          # ditto keeps the bundle's symlinks, permissions and signature intact.
          ditto -c -k --keepParent target/release/bundle/macos/EnvRouter.app "out/EnvRouter-$VERSION-arm64.zip"
          cargo build --locked --release -p envrouter-cli -p envrouter-shim -p envrouter-keychain
          cli="envrouter-cli-$VERSION-aarch64-apple-darwin"
          mkdir "$cli"
          cp target/release/envrouter target/release/envrouter-shim target/release/envrouter-keychain "$cli/"
          tar -czf "out/$cli.tar.gz" "$cli"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: out/*

  linux:
    needs: check
    strategy:
      matrix:
        include:
          # 22.04 for an older glibc, so the builds run on more distros.
          - runner: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            triple: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          # Only the x86_64 mingw compiler, to link the Windows helper; not the whole mingw-w64 suite.
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev gcc-mingw-w64-x86-64
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add x86_64-pc-windows-gnu
      - run: pnpm install --frozen-lockfile
      # The Windows build of the secrets helper, which a WSL distro runs to keep its secrets in
      # the Windows Credential Manager. Windows on Arm runs it too.
      - run: cargo build --locked --release -p envrouter-keychain --target x86_64-pc-windows-gnu
      # The .deb carries the Windows helper beside the shim, where the app installs it from.
      - run: |
          exe="$PWD/target/x86_64-pc-windows-gnu/release/envrouter-keychain.exe"
          pnpm tauri build --config "{\"bundle\":{\"linux\":{\"deb\":{\"files\":{\"/usr/bin/envrouter-keychain.exe\":\"$exe\"}}}}}"
      - name: Package
        run: |
          mkdir -p out
          cp target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage out/
          cargo build --locked --release -p envrouter-cli -p envrouter-shim -p envrouter-keychain
          cli="envrouter-cli-$VERSION-${{ matrix.triple }}"
          mkdir "$cli"
          cp target/release/envrouter target/release/envrouter-shim target/release/envrouter-keychain \
            target/x86_64-pc-windows-gnu/release/envrouter-keychain.exe "$cli/"
          tar -czf "out/$cli.tar.gz" "$cli"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.triple }}
          path: out/*

  publish:
    needs: [check, macos, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd out && sha256sum * > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" out/* --verify-tag --title "EnvRouter $VERSION" --generate-notes

      # The built-in token can't write to another repository; TAP_TOKEN is a fine-grained token
      # with Contents read and write on homebrew-tap only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pixel-perfect-software/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}
          path: tap
      - name: Update the tap
        run: |
          packaging/homebrew/render.sh "$VERSION" out/SHA256SUMS tap
          cd tap
          git add Casks Formula
          if git diff --cached --quiet; then
            echo "The tap already describes $VERSION."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --message "envrouter $VERSION"
          # Another app's release may have pushed to the tap meanwhile.
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          echo "::error::Couldn't push the update to homebrew-tap."
          exit 1
