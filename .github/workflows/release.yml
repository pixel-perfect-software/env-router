name: Release

# Pushing a tag like `v0.2.0` builds EnvRouter for macOS and Linux, publishes one GitHub release
# with every build, and renders the Homebrew cask (the macOS app) and formula (the CLI, macOS and
# Linux) into pixel-perfect-software/homebrew-tap from packaging/homebrew. The tag must match the
# version (Cargo.toml's [workspace.package], and package.json) and sit on main.

on:
  push:
    tags: ['v*']

# Actions are pinned to the commit of a release, as in ci.yml. Nothing here restores a cache:
# a release builds only from its tagged source, so a poisoned cache can't reach what users
# install. The Linux builds run in the CI image (.github/ci/Containerfile), pinned by digest like
# an action, so they install nothing from Ubuntu's mirror while they run.
# Read-only by default: the build jobs run third-party actions, and none of them needs to write.
# Only publish, which creates the release, can.
permissions:
  contents: read

# One release at a time, so two can't race to update the tap.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # Long enough to wait out CI on a commit tagged right after its merge.
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read # to find the commit's CI run
      checks: read # and its linux and macos checks
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # to check the tag is on main
          persist-credentials: false
      # For `cargo metadata`; rustup installs the version rust-toolchain.toml pins.
      - run: rustup show active-toolchain || rustup toolchain install
      - id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Every crate's version, the app's included (tauri.conf.json names none, so the app
          # takes src-tauri's), as Cargo resolves it from [workspace.package]: one value, or a
          # crate that stopped inheriting it shows up here. package.json repeats it.
          crates=$(cargo metadata --no-deps --format-version 1 | jq -r '[.packages[].version] | unique | join(", ")')
          npm=$(node -p "require('./package.json').version")
          if [ "$crates" != "$version" ] || [ "$npm" != "$version" ]; then
            echo "::error::$GITHUB_REF_NAME doesn't match the version: the crates are at $crates (Cargo.toml's [workspace.package]), package.json at $npm."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME isn't on main."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Only a commit CI finished testing ships: the checks branch protection requires, passed on
      # this commit. Waits for a run still going.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: sh .github/scripts/ci-passed.sh "$GITHUB_SHA" linux macos

  # Each platform's app and CLI build in jobs of their own, side by side, since the CLI needs
  # nothing from the app. They're separate cargo builds anyway: on macOS both binaries are named
  # `envrouter` in target/release.
  #
  # Every job renders THIRD-PARTY-NOTICES.txt, the licences of everything built into a release,
  # while it compiles, and only bundling needs it, so no build waits for a notices job. The
  # file depends only on Cargo.lock, pnpm-lock.yaml and packaging/notices (its targets cover
  # every platform), so each copy is the same; the macOS app's is the one the release lists.
  macos:
    needs: check
    # Apple Silicon: the bundle is arm64-only for now.
    runs-on: macos-15
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reads the pnpm version from `packageManager` in package.json, and Node's from .tool-versions.
      # Node first: pnpm/action-setup installs pnpm with npm, which the CI image doesn't have.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # The runner's rustup installs the version rust-toolchain.toml pins.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-about@0.9.2
      - run: pnpm install --frozen-lockfile
      # Signs ad hoc (bundle.macOS.signingIdentity "-"); there's no Developer ID to notarize with.
      # The licences go in Contents/Resources (src-tauri/tauri.licences.conf.json, the file
      # `pnpm bundle` uses too). They're a bundle-time config, not in tauri.conf.json, because
      # tauri-build checks every resource exists when the app crate compiles.
      - name: Build
        run: |
          cargo fetch --locked
          pnpm notices &
          notices=$!
          pnpm tauri build --no-bundle
          wait "$notices"
          pnpm tauri bundle --config src-tauri/tauri.licences.conf.json
      - name: Package
        run: |
          mkdir -p out
          # GPL-3.0 and the dependencies' licences travel with every copy: a bundle without them
          # stops the release here.
          for file in LICENSE THIRD-PARTY-NOTICES.txt; do
            test -s "target/release/bundle/macos/EnvRouter.app/Contents/Resources/$file" \
              || { echo "::error::EnvRouter.app has no Contents/Resources/$file."; exit 1; }
          done
          # ditto keeps the bundle's symlinks, permissions and signature intact.
          ditto -c -k --keepParent target/release/bundle/macos/EnvRouter.app "out/EnvRouter-$VERSION-arm64.zip"
          cp target/notices/THIRD-PARTY-NOTICES.txt out/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: out/*

  linux:
    needs: check
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read # to pull the image
    # Ubuntu 22.04 inside, for its older glibc, so the builds run on more distros.
    container:
      image: ghcr.io/pixel-perfect-software/envrouter-ci@sha256:2d645642c11da781ffaf7647bb6cea427eff84a4da365e257dc99012ac196c62
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node first: pnpm/action-setup installs pnpm with npm, which the CI image doesn't have.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add x86_64-pc-windows-gnu
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-about@0.9.2
      - run: pnpm install --frozen-lockfile
      # Both bundles carry the Windows build of the secrets helper beside the shim, in usr/bin,
      # where the app installs it from: a WSL distro runs it to keep its secrets in the Windows
      # Credential Manager (Windows on Arm runs it too). The licences go in the app's resources
      # (/usr/lib/EnvRouter in the .deb), in both bundles, as on macOS.
      - name: Build
        run: |
          cargo fetch --locked
          pnpm notices &
          notices=$!
          cargo build --locked --profile helpers -p envrouter-keychain --target x86_64-pc-windows-gnu
          pnpm tauri build --no-bundle
          wait "$notices"
          exe="$PWD/target/x86_64-pc-windows-gnu/helpers/envrouter-keychain.exe"
          files="{\"files\":{\"/usr/bin/envrouter-keychain.exe\":\"$exe\"}}"
          pnpm tauri bundle --config src-tauri/tauri.licences.conf.json \
            --config "{\"bundle\":{\"linux\":{\"deb\":$files,\"appimage\":$files}}}"
      - run: mkdir -p out && cp target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage out/
      # Until 0.7.2 only the .deb had the helper, so WSL users on the AppImage couldn't store a
      # secret. A bundle without it fails here, before anything is published.
      # And both carry the licences, which GPL-3.0 and the dependencies' licences require with
      # every copy (#46).
      - name: Check both bundles carry the Windows helper and the licences
        working-directory: out
        run: |
          want="usr/bin/envrouter-keychain.exe usr/lib/EnvRouter/LICENSE usr/lib/EnvRouter/THIRD-PARTY-NOTICES.txt"
          deb=$(dpkg-deb -c ./*.deb)
          set -- ./*.AppImage
          "$1" --appimage-extract 'usr/*' >/dev/null
          for file in $want; do
            if ! echo "$deb" | grep -q "$file\$"; then
              echo "::error::The .deb has no $file."
              exit 1
            fi
            if [ ! -s "squashfs-root/$file" ]; then
              echo "::error::The AppImage has no $file."
              exit 1
            fi
          done
          rm -rf squashfs-root
          echo "The .deb and the AppImage both carry: $want"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.triple }}
          path: out/*

  # The CLI with the shim and the secrets helper beside it, as the formula installs them. The
  # helpers come from the CLI's own build (crates/ops builds them, with the helpers profile,
  # into target/shim), so they're the same build the app bundles.
  cli-macos:
    needs: check
    runs-on: macos-15
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TRIPLE: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node first: pnpm/action-setup installs pnpm with npm, which the CI image doesn't have.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-about@0.9.2
      # The notices read node_modules for the window's packages.
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: |
          cargo fetch --locked
          pnpm notices notices/THIRD-PARTY-NOTICES.txt &
          notices=$!
          cargo build --locked --release -p envrouter-cli
          wait "$notices"
      - name: Package
        run: |
          mkdir -p out
          cli="envrouter-cli-$VERSION-$TRIPLE"
          mkdir "$cli"
          cp target/release/envrouter "target/shim/$TRIPLE/helpers/envrouter-shim" "target/shim/$TRIPLE/helpers/envrouter-keychain" \
            LICENSE notices/THIRD-PARTY-NOTICES.txt "$cli/"
          tar -czf "out/$cli.tar.gz" "$cli"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ env.TRIPLE }}
          path: out/*

  # The same on Linux, in the CI image as the app's builds are, with the Windows build of the
  # secrets helper beside the others for WSL.
  cli-linux:
    needs: check
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read # to pull the image
    container:
      image: ghcr.io/pixel-perfect-software/envrouter-ci@sha256:2d645642c11da781ffaf7647bb6cea427eff84a4da365e257dc99012ac196c62
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TRIPLE: ${{ matrix.triple }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node first: pnpm/action-setup installs pnpm with npm, which the CI image doesn't have.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add x86_64-pc-windows-gnu
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-about@0.9.2
      # The notices read node_modules for the window's packages.
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: |
          cargo fetch --locked
          pnpm notices notices/THIRD-PARTY-NOTICES.txt &
          notices=$!
          cargo build --locked --release -p envrouter-cli
          cargo build --locked --profile helpers -p envrouter-keychain --target x86_64-pc-windows-gnu
          wait "$notices"
      - name: Package
        run: |
          mkdir -p out
          cli="envrouter-cli-$VERSION-$TRIPLE"
          mkdir "$cli"
          cp target/release/envrouter "target/shim/$TRIPLE/helpers/envrouter-shim" "target/shim/$TRIPLE/helpers/envrouter-keychain" \
            target/x86_64-pc-windows-gnu/helpers/envrouter-keychain.exe LICENSE notices/THIRD-PARTY-NOTICES.txt "$cli/"
          tar -czf "out/$cli.tar.gz" "$cli"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ env.TRIPLE }}
          path: out/*

  publish:
    needs: [check, macos, linux, cli-macos, cli-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # to create the release
      id-token: write # to sign the provenance attestations
      attestations: write # to store them
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - run: cd out && sha256sum -- * > SHA256SUMS
      # A signed build provenance attestation for every asset in SHA256SUMS: it ties the file to
      # this workflow, the tagged commit and this run. With no Developer ID or notarization, it's
      # how a user checks a download came from here (`gh attestation verify <file> --repo
      # pixel-perfect-software/env-router`). Made before the release, so assets are never
      # published without one.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: out/SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --verify-tag --title "EnvRouter $VERSION" --generate-notes

      # The built-in token can't write to another repository; TAP_TOKEN is a fine-grained token
      # with Contents read and write on homebrew-tap only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pixel-perfect-software/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}
          path: tap
      - name: Update the tap
        run: |
          packaging/homebrew/render.sh "$VERSION" out/SHA256SUMS tap
          cd tap
          git add Casks Formula
          if git diff --cached --quiet; then
            echo "The tap already describes $VERSION."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --message "envrouter $VERSION"
          # Another app's release may have pushed to the tap meanwhile.
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          echo "::error::Couldn't push the update to homebrew-tap."
          exit 1
