name: Dev containers

# Builds the local containers in dev/containers (docs/contributing.md: checking Linux and Windows
# from a Mac) when they change, so a broken Containerfile or compose file fails its pull request
# instead of the next person who runs it. Nothing is pushed: they're built from scratch on a
# contributor's machine. The Wine image is x86_64 only, hence the amd64 runner.
on:
  pull_request:
    paths: [ "dev/containers/**", ".github/workflows/dev-containers.yml" ]
  push:
    branches: [ main ]
    paths: [ "dev/containers/**", ".github/workflows/dev-containers.yml" ]

# Actions are pinned to the commit of a release, as in ci.yml.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker compose -f dev/containers/compose.yaml config --quiet
      - run: docker build -f dev/containers/Containerfile dev/containers
      - run: docker build -f dev/containers/Containerfile.wine dev/containers
