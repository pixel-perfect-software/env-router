name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The shell tests skip a shell that isn't installed; here a missing one fails the run instead.
env:
  ENVROUTER_REQUIRE_SHELLS: 1

jobs:
  check:
    # macOS: the app ships there, and the Rust tests drive a real zsh, bash and fish.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      # The runner's rustup installs the version and components rust-toolchain.toml pins.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete
      # The runner has zsh and bash; fish's folder check is only tested where fish is installed.
      - run: brew install fish

      - run: pnpm install --frozen-lockfile
      - run: pnpm format-and-lint
      - run: pnpm test
      # Type-checks, and produces dist/, which the app crate embeds at compile time.
      - run: pnpm build

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Licences (no copyleft in an MIT app), RustSec advisories, sources.
      - run: cargo deny check
      - run: cargo machete

  linux:
    # The backend, shim and secrets crates on Linux, with real zsh, bash and fish. The app crate
    # joins once the Linux window exists (it needs the WebKitGTK development packages).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y zsh fish
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked -p envrouter-core -p envrouter-shim -p envrouter-keychain -p envrouter-ops --all-targets -- -D warnings
      - run: cargo test --locked -p envrouter-core -p envrouter-shim -p envrouter-keychain -p envrouter-ops
