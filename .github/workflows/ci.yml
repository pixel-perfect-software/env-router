name: CI

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned to the commit of a release (the version is in the comment beside it), so a
# moved or compromised tag can't change what runs. Dependabot (.github/dependabot.yml) proposes
# updates.
permissions:
  contents: read

# A new push to a pull request cancels its run in progress. On main every commit's run finishes:
# the release ships only a commit whose run passed (.github/scripts/ci-passed.sh), and v0.6.0 was
# tagged on one whose run a later push cancelled. So main's runs are grouped by commit, not by
# branch: within one group GitHub keeps one queued run and cancels the one before it, even with
# cancel-in-progress off, which dropped 0151e31's run unstarted when three merges landed at once.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Docs, design notes and the local containers don't change what CI
  # tests, so a change to only those skips the other jobs. The workflow itself still runs:
  # branch protection requires the linux and macos checks, and a skipped job counts as passing,
  # where a workflow that never started would block the merge.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**.md'
              - '!docs/**'
              - '!LICENSE'
              - '!.impeccable/**'
              - '!.claude/**'
              - '!dev/containers/**'

  # The frontend, formatting, licences and the release's notices, beside the Rust tests rather
  # than before them: none of it needs the other's build.
  checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reads the pnpm version from `packageManager` in package.json, and Node's from .tool-versions.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      # The runner's rustup installs the version and components rust-toolchain.toml pins.
      - run: rustup show active-toolchain || rustup toolchain install
      # Nothing here compiles; the cache keeps the downloaded crates that cargo-deny and the
      # notices read.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Pull requests restore main's cache but don't save their own, so the cache store keeps
          # one useful copy instead of filling with per-branch ones.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2,cargo-machete@0.9.2,cargo-about@0.9.2

      - run: pnpm install --frozen-lockfile
      - run: pnpm format-and-lint
      - run: pnpm test
      - run: pnpm build

      - run: cargo fmt --all -- --check
      # Licences (permissive dependencies only), RustSec advisories, sources.
      - run: cargo deny check
      # The release's third-party notices, so a dependency without a licence text fails here.
      - run: pnpm notices
      - run: cargo machete

  # The backend, shim, secrets and CLI tests with real zsh, bash and fish, on Linux, where
  # runners start sooner and cost a tenth as much as a Mac's.
  rust:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read # to pull the image
    # The packages the Linux jobs need are in this image (.github/ci/Containerfile), so no job
    # waits on Ubuntu's mirror. ci-image.yml builds it and prints the digest to pin, here, in
    # app-linux and in release.yml.
    container:
      image: ghcr.io/pixel-perfect-software/envrouter-ci@sha256:2d645642c11da781ffaf7647bb6cea427eff84a4da365e257dc99012ac196c62
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      # An init as PID 1 reaps orphans, as launchd or systemd would; GitHub's own PID 1 doesn't,
      # so a process the tests kill would linger as a zombie (mcp_probe's stop test).
      options: --init
    env:
      # The shell tests skip a shell that isn't installed; here a missing one fails the run.
      ENVROUTER_REQUIRE_SHELLS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo clippy --locked -p envrouter-core -p envrouter-shim -p envrouter-keychain -p envrouter-ops -p envrouter-cli --all-targets -- -D warnings
      - run: cargo test --locked -p envrouter-core -p envrouter-shim -p envrouter-keychain -p envrouter-ops -p envrouter-cli
      # The secret store's round trip, through a GNOME Keyring started in a private D-Bus session.
      - run: >-
          dbus-run-session -- sh -c 'printf ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null
          && cargo test --locked -p envrouter-keychain -- --ignored'
      # The Windows secrets helper a WSL distro runs, linked as the release links it: clippy only
      # type-checks, so a link failure first showed in the release. Its Credential Manager round
      # trip runs under Wine with dev/containers.
      - run: cargo clippy --locked -p envrouter-keychain --target x86_64-pc-windows-gnu --all-targets -- -D warnings
      - run: cargo build --locked -p envrouter-keychain --target x86_64-pc-windows-gnu

  # The desktop app crate on Linux: tauri.linux.conf.json, GTK and WebKitGTK, which only the
  # release built before. In the image the release builds in.
  app-linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read # to pull the image
    container:
      image: ghcr.io/pixel-perfect-software/envrouter-ci@sha256:2d645642c11da781ffaf7647bb6cea427eff84a4da365e257dc99012ac196c62
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The app crate embeds the built frontend at compile time; an empty one compiles, and the
      # checks job builds the real one.
      - run: mkdir -p dist
      - run: cargo clippy --locked -p envrouter --all-targets -- -D warnings
      - run: cargo test --locked -p envrouter

  # The check branch protection requires for everything that doesn't need a Mac. It passes only
  # when checks, rust and app-linux all passed, or all were skipped for a docs-only change. It runs
  # whatever they did (`always()`): left to the default, a failure above would skip it, and a
  # skipped job counts as passing.
  linux:
    needs: [changes, checks, rust, app-linux]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          CHECKS: ${{ needs.checks.result }}
          RUST: ${{ needs.rust.result }}
          APP: ${{ needs.app-linux.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "changes: $CHANGES, checks: $CHECKS, rust: $RUST, app-linux: $APP"
          [ "$CHANGES" = success ] || exit 1
          if [ "$CODE" = true ]; then
            [ "$CHECKS" = success ] && [ "$RUST" = success ] && [ "$APP" = success ]
          else
            [ "$CHECKS" = skipped ] && [ "$RUST" = skipped ] && [ "$APP" = skipped ]
          fi

  macos:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Only what needs a Mac: the Keychain backend, the desktop app crate, and the shell tests'
    # macOS behaviour (login shells, path_helper). fish behaves the same everywhere, so the Linux
    # job covers it and this one skips installing it.
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The app crate embeds the built frontend at compile time; an empty one compiles, and the
      # Linux job builds the real one.
      - run: mkdir -p dist
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      # The cask and formula, rendered as a release would and checked with brew style and
      # brew audit --strict, so a broken template fails here instead of `brew install` after a
      # release. The runner has Homebrew.
      - run: sh .github/scripts/lint-homebrew.sh
