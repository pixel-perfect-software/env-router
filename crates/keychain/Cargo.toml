[package]
name = "envrouter-keychain"
version = "0.1.0"
description = "EnvRouter's MCP secrets in the platform's secret store, and the helper binary the shim runs to read them"
license = "MIT"
edition = "2021"
publish = false

[[bin]]
name = "envrouter-keychain"
path = "src/main.rs"

[dependencies]
envrouter-core.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework.workspace = true

[lints]
workspace = true
