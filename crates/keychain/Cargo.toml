[package]
name = "envrouter-keychain"
version.workspace = true
description = "EnvRouter's MCP secrets in the platform's secret store, and the helper binary the shim runs to read them"
license = "GPL-3.0-or-later"
edition = "2021"
publish = false

[[bin]]
name = "envrouter-keychain"
path = "src/main.rs"

[dependencies]
envrouter-core.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

# Pure Rust D-Bus and crypto: no OpenSSL or async runtime in the helper the shim runs.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
secret-service = { version = "5.2", default-features = false, features = ["rt-async-io-crypto-rust"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
