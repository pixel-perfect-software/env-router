# cargo-deny: run `cargo deny check` (CI does). EnvRouter is MIT and ships only for Apple
# silicon Macs, so the graph is checked for that target alone.

[graph]
targets = ["aarch64-apple-darwin"]
all-features = false

[advisories]
# RustSec advisories for anything in the graph fail the check; yanked crates do too.
yanked = "deny"

[licenses]
# Permissive licences only. GPL, AGPL and LGPL-only crates fail, so nothing copyleft (such as
# McpMux's GPL-3.0 code) can enter an MIT app by way of a dependency.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  # File-level copyleft; arrives through Tauri's HTML parser (cssparser, selectors), used
  # unmodified.
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
# Several versions of one crate are common under Tauri; report them, don't fail on them.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
