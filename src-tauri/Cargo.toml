[package]
name = "envrouter"
version.workspace = true
description = "Routes each coding agent to the right account and MCP servers by folder"
authors = ["Tyler Robertson <tylerrdev@gmail.com>"]
license = "GPL-3.0-or-later"
edition = "2021"
publish = false

[lib]
# Named apart from the binary so the two build artifacts can't collide.
name = "envrouter_lib"

[build-dependencies]
envrouter-build-support.workspace = true
tauri-build = { version = "2", features = [] }

[dependencies]
envrouter-core.workspace = true
envrouter-ops.workspace = true
serde.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

# The macOS traffic lights (`traffic_lights.rs`). Tauri depends on the same versions already.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"] }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
