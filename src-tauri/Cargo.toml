[package]
name = "envrouter"
version = "0.4.0"
description = "Per-directory environment routing for developer CLIs"
authors = ["Tyler Robertson"]
license = "GPL-3.0-or-later"
edition = "2021"
publish = false

[lib]
# Named apart from the binary so the two build artifacts can't collide.
name = "envrouter_lib"

[build-dependencies]
envrouter-build-support.workspace = true
tauri-build = { version = "2", features = [] }

[dependencies]
envrouter-core.workspace = true
envrouter-ops.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[lints]
workspace = true
