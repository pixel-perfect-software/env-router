[package]
name = "envrouter"
version = "0.1.0"
description = "Per-directory environment routing for developer CLIs"
authors = ["Tyler Robertson"]
license = "MIT"
edition = "2021"
publish = false

[lib]
# Named apart from the binary so the two build artifacts can't collide.
name = "envrouter_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
envrouter-core.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
