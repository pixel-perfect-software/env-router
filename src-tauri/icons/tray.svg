<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 2.15 18 18" width="18" height="18">
  <!-- Menu bar template image: a folder with the points cut through it. macOS reads only the
       alpha, so the fork is a mask cutout: the lit branch cut through, the idle branch half
       cut. The viewBox hugs the glyph because tray-icon scales the image to 18 pt tall. -->
  <defs>
    <mask id="fork">
      <rect x="0" y="0" width="22" height="22" fill="#fff"/>
      <path d="M11 11c0 1.7-3 2.1-3.6 4.4" stroke="#808080" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <path d="M11 8.7v2.3c0 1.7 3 2.1 3.6 4.4" stroke="#000" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <circle cx="14.6" cy="15.7" r="1.8" fill="#000"/>
    </mask>
  </defs>
  <path d="M2.5 6.3V5a1.6 1.6 0 0 1 1.6-1.6h3.7l1.7 1.9h8.4a1.6 1.6 0 0 1 1.6 1.6v10.5a1.6 1.6 0 0 1-1.6 1.6H4.1a1.6 1.6 0 0 1-1.6-1.6z" fill="#000" mask="url(#fork)"/>
</svg>
